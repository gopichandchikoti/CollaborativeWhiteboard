# Optional legacy reference. The application uses SQLite and does not need this service.
services:
  postgres:
    profiles: [legacy-postgres]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whiteboard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD explicitly for the legacy database}
      POSTGRES_DB: ${POSTGRES_DB:-whiteboard}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
